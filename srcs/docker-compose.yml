# a service = a unit of work in docker compose. It will tell
#docker compose what images to build.
services:
  mariadb:
    build: requirements/mariadb
    volumes:
      - mariadb-database:/var/lib/mysql
    restart: always
    networks:
      - inception-network
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/mariadb_root_password
      - MARIADB_PASSWORD_FILE=/run/secrets/mariadb_password
    secrets:
      - mariadb_root_password
      - mariadb_password

  wordpress:
    depends_on:
      - mariadb
    build: requirements/wordpress
    volumes:
      - wp-content:/var/www/html
    restart: always
    networks:
      - inception-network
    environment:
      - CONFIG_FILE_PHP=${CONFIG_FILE_PHP}
      - WP_URL=https://${DOMAIN_NAME}
      - WP_DB_NAME=${WP_DB_NAME}
      - WP_DB_USER=${WP_DB_USER}
      - MARIADB_PORT=${MARIADB_PORT}
      - WP_ADMIN=${WP_ADMIN}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
      - WP_DB_PASSWORD_FILE=/run/secrets/mariadb_password
      - WP_ADMIN_PASSWORD_FILE=/run/secrets/wp_admin_password
      - WP_USER_PASSWORD_FILE=/run/secrets/wp_user_password
    secrets:
      - mariadb_password
      - wp_admin_password
      - wp_user_password
  
  nginx:
    depends_on:
      - wordpress
    hostname: nginx
    build: requirements/nginx
    volumes:
      - wp-content:/var/www/html
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}" #any traffic sent to 443 will be forwarded to 80 within the container
    restart: always
    networks:
      - inception-network


volumes:
  mariadb-database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb
  wp-content:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DATA_PATH}/wordpress

#a network is a way for containers to communicate with eachother

networks:
  inception-network:
    driver: bridge

secrets:
  mariadb_root_password:
    file: ../secrets/mariadb_root_password.txt
  mariadb_password:
    file: ../secrets/mariadb_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
